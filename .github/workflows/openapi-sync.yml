name: Sync openapi.json

# Mirrors the public API spec into openapi.json on main. A new spec is committed
# only after it passes the backend-term check, parses as OpenAPI 3.x, and the
# site still builds (`mint validate`). Mintlify then deploys main.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-sync
  cancel-in-progress: false

env:
  SPEC_URL: https://api.pav.bio/v1/openapi.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch the spec
        run: curl -sfS --retry 5 --retry-all-errors "$SPEC_URL" -o "$RUNNER_TEMP/openapi.json"

      - name: Check the spec for backend terms
        run: python3 scripts/check_backend_terms.py "$RUNNER_TEMP/openapi.json"

      - name: Check the spec is OpenAPI 3.x
        run: |
          python3 - "$RUNNER_TEMP/openapi.json" <<'EOF'
          import json, sys
          spec = json.load(open(sys.argv[1]))
          assert str(spec.get("openapi", "")).startswith("3."), f"not OpenAPI 3.x: {spec.get('openapi')!r}"
          assert spec.get("paths"), "no paths"
          print(f"OpenAPI {spec['openapi']}, {len(spec['paths'])} paths")
          EOF

      - name: Compare with openapi.json on main
        id: diff
        run: |
          if cmp -s "$RUNNER_TEMP/openapi.json" openapi.json; then
            echo "openapi.json already matches $SPEC_URL; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp "$RUNNER_TEMP/openapi.json" openapi.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Validate the site with the new spec
        if: steps.diff.outputs.changed == 'true'
        run: npx --yes mint@4.2.952 validate

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -q -m "Refresh openapi.json from api.pav.bio"
          git push origin HEAD:main
          echo "committed $(git rev-parse --short HEAD) to main"
